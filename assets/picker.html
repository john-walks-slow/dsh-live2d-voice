<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#10121c" />
	<title>Live2D 语音 · 会话</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
		html, body { margin: 0; min-height: 100%; background: #10121c; color: #e8eaf2; font: 15px/1.5 system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
		main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
		header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 2px 14px; }
		h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
		.actions { display: flex; gap: 8px; }
		button { font: inherit; color: inherit; background: #1c2030; border: 1px solid #2a3048; border-radius: 10px; padding: 8px 14px; cursor: pointer; transition: background .15s; }
		button:active { background: #262c42; }
		#new { background: #2d4a8a; border-color: #3d5fa8; }
		#new:active { background: #365a9e; }
		#new[disabled], #refresh[disabled] { opacity: .55; cursor: default; }
		ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
		li { background: #161a29; border: 1px solid #242a40; border-radius: 14px; padding: 13px 15px; cursor: pointer; transition: background .15s, border-color .15s; }
		li:active { background: #1c2136; border-color: #31406b; }
		.row1 { display: flex; align-items: center; gap: 8px; }
		.title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
		.title.untitled { color: #8b93ad; font-weight: 400; }
		.dot { width: 9px; height: 9px; border-radius: 50%; background: #3f6; box-shadow: 0 0 6px #3f6; flex: none; }
		.row2 { display: flex; align-items: center; gap: 8px; margin-top: 3px; color: #8b93ad; font-size: 13px; }
		.cwd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; direction: rtl; text-align: left; }
		.tag { flex: none; font-size: 12px; border: 1px solid #2a3048; border-radius: 6px; padding: 0 6px; color: #7b83a0; }
		#status { text-align: center; color: #8b93ad; padding: 36px 0 8px; font-size: 14px; }
		#empty { text-align: center; padding: 48px 12px; color: #8b93ad; }
		#empty .big { font-size: 40px; margin-bottom: 10px; }
	</style>
</head>
<body>
	<main>
		<header>
			<h1>Live2D 语音</h1>
			<div class="actions">
				<button id="refresh" title="刷新">⟳</button>
				<button id="new">＋ 新会话</button>
			</div>
		</header>
		<div id="status">加载中…</div>
		<ul id="list"></ul>
		<div id="empty" hidden>
			<div class="big">🎭</div>
			还没有会话<br />点右上角「＋ 新会话」开始
		</div>
	</main>
	<script>
		"use strict";
		const qs = new URLSearchParams(location.search);
		const token = qs.get("token") ?? "";
		const api = (path) => `${path}${token ? `?token=${encodeURIComponent(token)}` : ""}`;
		const list = document.getElementById("list");
		const status = document.getElementById("status");
		const empty = document.getElementById("empty");
		const refreshBtn = document.getElementById("refresh");
		const newBtn = document.getElementById("new");
		const enter = (sessionId) => {
			location.href = `/live2d-voice/app?session=${encodeURIComponent(sessionId)}${token ? `&token=${encodeURIComponent(token)}` : ""}`;
		};
		const relative = (ms) => {
			const delta = Date.now() - ms;
			if (delta < 60_000) return "刚刚";
			if (delta < 3_600_000) return `${Math.floor(delta / 60_000)} 分钟前`;
			if (delta < 86_400_000) return `${Math.floor(delta / 3_600_000)} 小时前`;
			return `${Math.floor(delta / 86_400_000)} 天前`;
		};
		const lastSegment = (cwd) => {
			if (!cwd) return "";
			const parts = cwd.replace(/\/+$/, "").split("/");
			return parts[parts.length - 1] || cwd;
		};
		const render = (items) => {
			status.hidden = true;
			empty.hidden = items.length > 0;
			list.replaceChildren(...items.map((s) => {
				const li = document.createElement("li");
				const row1 = document.createElement("div");
				row1.className = "row1";
				if (s.running) { const dot = document.createElement("span"); dot.className = "dot"; row1.append(dot); }
				const title = document.createElement("span");
				title.className = `title${s.title ? "" : " untitled"}`;
				title.textContent = s.title || `${s.sessionId.slice(0, 18)}…`;
				row1.append(title);
				const row2 = document.createElement("div");
				row2.className = "row2";
				const cwd = document.createElement("span");
				cwd.className = "cwd";
				cwd.textContent = lastSegment(s.cwd) || "—";
				row2.append(cwd);
				if (s.blank) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "空"; row2.append(tag); }
				const time = document.createElement("span");
				time.textContent = relative(s.updatedAt);
				row2.append(time);
				li.append(row1, row2);
				li.addEventListener("click", () => enter(s.sessionId));
				return li;
			}));
		};
		const load = async () => {
			try {
				const r = await fetch(api("/live2d-voice/sessions"), { headers: { accept: "application/json" } });
				if (!r.ok) throw new Error(`HTTP ${r.status}`);
				const v = await r.json();
				if (!v.ok) throw new Error(v.message || "list failed");
				render(v.items);
			} catch (e) {
				status.hidden = false;
				status.textContent = `加载失败：${e instanceof Error ? e.message : String(e)}`;
			}
		};
		const create = async () => {
			newBtn.disabled = true;
			try {
				const r = await fetch(api("/live2d-voice/session"), { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
				const v = await r.json().catch(() => ({}));
				if (r.ok && v.ok) enter(v.sessionId);
				else { status.hidden = false; status.textContent = `创建失败：${v.message || `HTTP ${r.status}`}`; newBtn.disabled = false; }
			} catch (e) {
				status.hidden = false;
				status.textContent = `创建失败：${e instanceof Error ? e.message : String(e)}`;
				newBtn.disabled = false;
			}
		};
		refreshBtn.addEventListener("click", () => { refreshBtn.disabled = true; void load().finally(() => { refreshBtn.disabled = false; }); });
		newBtn.addEventListener("click", () => void create());
		void load();
		setInterval(() => { if (document.visibilityState === "visible") void load(); }, 15_000);
	</script>
</body>
</html>
